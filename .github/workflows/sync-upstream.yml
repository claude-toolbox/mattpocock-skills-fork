name: Sync Upstream

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync upstream
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 添加上游仓库
          git remote add upstream https://github.com/mattpocock/skills.git || true
          # 获取上游最新内容
          git fetch upstream main
          # 记录当前提交
          OLD_HEAD=$(git rev-parse HEAD)
          # 合并上游
          git merge upstream/main --no-edit --allow-unrelated-histories || exit 0
          echo "Changed files:"
          git diff --name-only $OLD_HEAD HEAD || true
          # 保留当前仓库自己的 GitHub Actions 工作流
          git restore --source=$OLD_HEAD .github/workflows || true
          git add .github/workflows
          # 如果 workflows 有变更则提交
          git diff --cached --quiet || git commit -m "Keep local workflows"
          # 推送到当前仓库
          git push origin main
